<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission T · Track Lab</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f0;color:#252b2c;font:14px system-ui,sans-serif}canvas{display:block}header{position:absolute;z-index:2;top:20px;left:24px;right:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}a{color:inherit;text-decoration:none}header a{font-weight:800;margin-right:auto}button,select{font:inherit;border:1px solid #d1d3cb;background:#fffdf8e8;color:inherit;border-radius:7px;padding:10px 13px;cursor:pointer}button[aria-pressed=true]{background:#2d6f64;color:#fff}aside{position:absolute;left:24px;bottom:24px;max-width:470px;background:#fffdf8ed;border:1px solid #dddcd5;border-radius:12px;padding:20px;box-shadow:0 8px 30px #2221}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 8px}p{line-height:1.65;margin:8px 0;color:#63716e}.stats{font-variant-numeric:tabular-nums;font-weight:600;color:#293b36}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hint{color:#aa462c;font-weight:600;min-height:24px}#status{font-size:12px}#error{color:#a42626}#mapCanvas{position:absolute;top:88px;right:24px;width:200px;height:190px;background:#fffdf8dc;border:1px solid #dddcd5;border-radius:10px}kbd{background:#e9eae3;padding:2px 4px;border-radius:3px}@media(max-width:700px){header{top:12px;left:12px;right:12px;gap:5px}header a{width:100%}button,select{padding:8px;font-size:12px}aside{left:12px;right:12px;bottom:12px;padding:14px;max-width:none}#mapCanvas{width:130px;height:120px;top:110px;right:12px}p{font-size:12px}h1{font-size:21px}}
</style></head><body>
<header><a href="./">MISSION T / TRACK LAB</a><select id="track" aria-label="트랙 선택"><option value="harbor-run">Harbor Run</option><option value="canyon-flight">Canyon Flight</option><option value="alpine-ring">Alpine Ring</option></select><button id="view">추적 시점</button><button id="png">PNG 저장</button><button id="glb">GLB 내보내기</button></header>
<canvas id="mapCanvas" width="400" height="380" aria-label="트랙 경로와 지름길"></canvas>
<aside><h1 id="name">Loading…</h1><p id="description"></p><p id="spec"></p><p class="stats" id="telemetry">불러오는 중</p><p id="feature" class="hint"></p><p><kbd>↑↓</kbd> 가속·제동 <kbd>←→</kbd> 조향 <kbd>Shift</kbd> 드리프트<br><kbd>Space</kbd> 점프·길게 눌러 활강 <kbd>E</kbd> 부스터</p>
<div class="actions"><button id="auto" aria-pressed="false">자동 주행</button><button id="shortcut" aria-pressed="false">지름길 사용</button><button id="restart">출발점</button><button id="jump">점프 구간</button><button id="fork">지름길 입구</button><button id="pause" aria-pressed="false">일시정지</button></div>
<p id="status" role="status">트랙 로딩 중…</p><p id="error"></p></aside>
<script type="module" src="src/track-lab.js"></script></body></html>
